SEED: null
OUTPUT_DIR: /data/qingyuyang/SL/ESM4SL/output/lora/cell-line/scene/fold  # change

DATALOADER:
  PIN_MEMORY: True
  DROP_LAST: True
  PERSISTENT_WORKERS: False
  
  TRAIN:
    BATCH_SIZE: 8
    NUM_WORKERS: 8

  VAL:
    BATCH_SIZE: 0
    NUM_WORKERS: 0

  TEST:
    BATCH_SIZE: 0
    NUM_WORKERS: 0

DATASET:
  NAME: SLrawDataset
  TRAIN_FILE: /data/qingyuyang/SL/ESM4SL/data/SLKB/cell-line/scene/sl_train_{fold}.csv  # change
  VAL_FILE: /data/qingyuyang/SL/ESM4SL/data/SLKB/cell-line/scene/sl_test_{fold}.csv  # change
  TEST_FILE: /data/qingyuyang/SL/ESM4SL/data/SLKB/cell-line/scene/sl_test_{fold}.csv  # change
  # SL_ROOT: /data/qingyuyang/SL/ESM4SL/data/SLKB/cell_line/table
  CELL_LINE: null
  # TEST_FOLD: 3  # generally shouldn't be None, and MUST be in {0, 1, ..., cv_num}
  # NP_RATIO: 5  # 1, 5, 20, None

  ESM_ROOT: null  # only if dataset is emb
  
  GENE_SEQ_PATH: /data/qingyuyang/SL/ESM4SL/data/SLKB/all_id_seq.pkl
  IF_RAW_SEQ: True

  TRANSFORM:
    NAME: null

MODEL:
  NAME: LoRA
  DEVICE: cuda

  IN_CHANNELS: 2560
  HIDDEN_CHANNELS: null
  OUT_CHANNELS: 1
  ACT_LAYER: gelu  # relu
  NORM_LAYER: batchnorm  # layernorm?

  NUM_END_LORA_LAYERS: 1 #?
  NUM_LORA_R: 8
  NUM_LORA_ALPHA: 8
  LORA_DROPOUT: 0.0

  # ENCODER_WEIGHT: ""
  # DECODER_WEIGHT: ""

  CRITERION:
    NAME: null
    TYPE: null

MODULE:
  NAME: LoRAModule
  COMPILE: False

  OPTIMIZER:
    # NAME: adamw
    BASE_LR: 0.0001
    # MOMENTUM: 0
    # WEIGHT_DECAY: 0.01

  # SCHEDULER:
  #   NAME: null  # LinearWarmupLR
  #   STEP_ON_EPOCHS: False

TRAINER:
  STRATEGY: deepspeed_stage_3_offload        # Set to `auto`, `ddp`, `deepspeed_stage_2`, `deepspeed_stage_3` ...
  PRECISION: 16-mixed

  CHECKPOINT:
    EVERY_N_EPOCHS: 1  # validate every n epochs
    SAVE_BEST: True    # If True, monitor will be required
    MONITOR: loss    # avgmtr means (auprc + auroc) / 2
    MONITOR_MODE: min

  MAX_EPOCHS: 60        # If profiler is enabled, this will be *automatically* set to 1
  LOG_EVERY_N_STEPS: 20
  ACCUMULATE_GRAD_BATCHES: 1
  NUM_SANITY_VAL_STEPS: 0

  # MILESTONES: [110, 160]
  GAMMA: 0.1
  WARMUP_FACTOR: 0.1
  WARMUP_EPOCHS: 20
  FACTOR: 0.1
  PATIENCE: 10

  CLIP_GRAD:
    ALGORITHM: null
    VALUE: null

  DETERMINISTIC: False  # Set to True to enable cudnn.deterministic
  BENCHMARK: False      # Set to True to enable cudnn.benchmark
  PROFILER: null        # Set to `advanced` or `pytorch` to enable profiling
  DETECT_ANOMALY: False # Set to True to enable anomaly detection
  SYNC_BATCHNORM: False # Set to True to enable sync batchnorm
