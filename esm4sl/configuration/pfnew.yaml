SEED: null
OUTPUT_DIR: /data/qingyuyang/SL/ESM4SL/output/attn/cell-line/scene/fold  # change

DATALOADER:
  PIN_MEMORY: True
  DROP_LAST: True
  PERSISTENT_WORKERS: False
  
  TRAIN:
    BATCH_SIZE: 16
    NUM_WORKERS: 8

  VAL:
    BATCH_SIZE: 0
    NUM_WORKERS: 0

  TEST:
    BATCH_SIZE: 0
    NUM_WORKERS: 0

DATASET:
  NAME: PFnewDataset
  TRAIN_FILE: /data/qingyuyang/SL/ESM4SL/data/SLKB/cell-line/scene/sl_train_{fold}.csv  # change
  VAL_FILE: /data/qingyuyang/SL/ESM4SL/data/SLKB/cell-line/scene/sl_test_{fold}.csv  # change
  TEST_FILE: /data/qingyuyang/SL/ESM4SL/data/SLKB/cell-line/scene/sl_test_{fold}.csv  # change
  CELL_LINE: null  # or cell-line name
  # TEST_FOLD: 0  # generally shouldn't be None, and MUST be in {0, 1, ..., cv_num-1}

  ESM_ROOT: /data/qingyuyang/SL/ESM4SL/data/SLKB/ESM2_emb  # change
  TEXT_PATH: /data/qingyuyang/SL/ESM4SL/data/prot_func/all_text.txt
  PROTREK_ROOT: /data/qingyuyang/SL/ESM4SL/data/biolinkbert_text_emb # /data/qingyuyang/SL/ESM4SL/data/protrek_text_emb

  GENE_SEQ_PATH: null  # only if dataset is raw
  IF_RAW_SEQ: False
  MAX_LEN: 1000

  TRANSFORM:
    NAME: null

MODEL:
  NAME: ProtFuncNew
  DEVICE: cuda

  # IN_CHANNELS: 1280
  # HIDDEN_CHANNELS: null
  # OUT_CHANNELS: 1
  # ACT_LAYER: gelu  # relu
  # NORM_LAYER: batchnorm  # layernorm?

  # KERNEL_SIZE: 3
  EMBED_DIM: 1024
  NUM_HEADS: 8
  # NUM_LAYERS: 1
  # LINEAR_DEPTH: 2
  DROPOUT: 0.1

  CRITERION:
    NAME: null
    TYPE: null

MODULE:
  NAME: PFnewModule
  COMPILE: False

  OPTIMIZER:
    BASE_LR: 0.0001

TRAINER:
  STRATEGY: auto        # Set to `auto`, `ddp`, `deepspeed_stage_2`, `deepspeed_stage_3` ...
  PRECISION: 32-true

  CHECKPOINT:
    EVERY_N_EPOCHS: 1  # validate every n epochs
    SAVE_BEST: True    # If True, monitor will be required
    MONITOR: loss    # avgmtr means (auprc + auroc) / 2
    MONITOR_MODE: min

  MAX_EPOCHS: 50        # If profiler is enabled, this will be *automatically* set to 1
  LOG_EVERY_N_STEPS: 500
  ACCUMULATE_GRAD_BATCHES: 1
  NUM_SANITY_VAL_STEPS: 0

  CLIP_GRAD:
    ALGORITHM: norm
    VALUE: 1.0

  DETERMINISTIC: False  # Set to True to enable cudnn.deterministic
  BENCHMARK: False      # Set to True to enable cudnn.benchmark
  PROFILER: null        # Set to `advanced` or `pytorch` to enable profiling
  DETECT_ANOMALY: False # Set to True to enable anomaly detection
  SYNC_BATCHNORM: False # Set to True to enable sync batchnorm
