SEED: 42
OUTPUT_DIR: /home/qingyuyang/ESM4SL/output/mlp/hw3_new  # change

DATALOADER:
  PIN_MEMORY: True
  DROP_LAST: False
  PERSISTENT_WORKERS: False
  
  TRAIN:
    BATCH_SIZE: 8
    NUM_WORKERS: 8
  
  VAL:
    BATCH_SIZE: 0
    NUM_WORKERS: 0
  
  TEST:
    BATCH_SIZE: 0
    NUM_WORKERS: 0

DATASET:
  NAME: HW3MLPDataset
  # SL_ROOT: /home/qingyuyang/ESM4SL/data/hw3  # change
  TRAIN_FILE: /home/qingyuyang/ESM4SL/data/hw3/train.csv
  VAL_FILE: /home/qingyuyang/ESM4SL/data/hw3/val.csv
  TEST_FILE: /home/qingyuyang/ESM4SL/data/hw3/sl_test.csv
  ESM_ROOT: /home/qingyuyang/ESM4SL/data/hw3/ESM2_emb  # change
  CELL_LINE: null

MODEL:
  NAME: MLP
  
  IN_CHANNELS: 2560
  HIDDEN_CHANNELS: 1280
  OUT_CHANNELS: 1

MODULE:
  NAME: HW3MLPModule
  COMPILE: False

  OPTIMIZER:
    BASE_LR: 0.0001

TRAINER:
  STRATEGY: auto        # Set to `auto`, `ddp`, `deepspeed_stage_2`, `deepspeed_stage_3` ...
  PRECISION: 32-true

  CHECKPOINT:
    EVERY_N_EPOCHS: 2  # validate every n epochs
    SAVE_BEST: True    # If True, monitor will be required
    MONITOR: auroc
    MONITOR_MODE: max

  MAX_EPOCHS: 150        # If profiler is enabled, this will be *automatically* set to 1
  LOG_EVERY_N_STEPS: 5
  ACCUMULATE_GRAD_BATCHES: 1
  NUM_SANITY_VAL_STEPS: 0

  CLIP_GRAD:
    ALGORITHM: norm
    VALUE: 1.0

  DETERMINISTIC: False  # Set to True to enable cudnn.deterministic
  BENCHMARK: False      # Set to True to enable cudnn.benchmark
  PROFILER: null        # Set to `advanced` or `pytorch` to enable profiling
  DETECT_ANOMALY: False # Set to True to enable anomaly detection
  SYNC_BATCHNORM: False # Set to True to enable sync batchnorm
